# Configuration Render pour ELibraryMobile Backend
# Documentation : https://render.com/docs/render-yaml

services:
  - type: web
    name: elibrary-backend
    env: docker
    repo: https://github.com/lbibuya/ELibraryMobile.git
    branch: main
    dockerfilePath: backend/Dockerfile
    plan: free
    autoDeploy: true

    envVars:
      - key: DATABASE_URL
        sync: false