# Exemple render.yaml — adapter les champs `repo`, `branch` et `plan` à votre compte
# Voir https://render.com/docs/render-yaml

services:
  - type: web
    name: elibrary-backend
    env: docker
    repo: <votre-repo-github>
    branch: main
    dockerfilePath: backend/Dockerfile
    plan: free
    autoDeploy: true
    # si vous utilisez des regions ou des health checks, ajoutez-les ici

# Note : créez la base de données Postgres depuis le tableau de bord Render et ajoutez
# la variable d'environnement DATABASE_URL dans la configuration du service.
